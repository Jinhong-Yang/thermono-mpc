name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and numerical tests
        run: python -m pytest -q --cov=thermono_mpc --cov-report=term-missing --cov-report=json
      - name: Build and check distributions
        run: |
          python -m build --wheel --sdist
          python -m twine check dist/*
      - name: CPU CLI smoke
        run: |
          thermono-mpc doctor
          thermono-mpc demo --profile cpu-smoke
      - name: Secondary synthetic example
        run: python examples/reuse_second_case.py
      - name: User-defined predictor example
        run: python examples/custom_predictor.py
