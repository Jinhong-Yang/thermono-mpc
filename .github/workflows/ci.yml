name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and numerical tests
        run: python -m pytest -q
      - name: CPU CLI smoke
        run: |
          thermono-mpc doctor
          thermono-mpc demo
      - name: Secondary synthetic example
        run: python examples/reuse_second_case.py
