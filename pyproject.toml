[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "thermono-mpc"
version = "0.1.0"
description = "Synthetic multi-zone heat treatment control with neural operators and deadline-aware MPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "PyYAML>=6,<7"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
torch = ["torch>=2.7"]
dev = ["pytest>=8", "build>=1", "torch>=2.7"]
paper = ["matplotlib>=3.9"]

[project.scripts]
thermono-mpc = "thermono_mpc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thermono_mpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
